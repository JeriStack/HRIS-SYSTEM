name: HRIS CI Pipeline

on:
  push:
    branches:
      - main
      - development
      - develop
      - 'HRIS-*'
  pull_request:
    branches:
      - main
      - development
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hris-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub Actions Workflow Lint (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run actionlint
        run: |
          echo "Linting GitHub Actions workflow definitions..."
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest
          echo "All GitHub Actions workflows passed actionlint validation!"

  php-checks:
    name: PHP Syntax, Linting, Static Analysis, and Tests
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: hris_test
          MYSQL_USER: hris_test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hris_test
      DB_USERNAME: hris_test_user
      DB_PASSWORD: test_password
      APP_ENV: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify secrets are not tracked
        shell: bash
        run: |
          echo "Verifying no .env files or credentials are tracked in Git..."
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env file is tracked in Git! Keep secrets, .env files, and credentials out of Git."
            exit 1
          fi

          echo "Scanning tracked files for potential credentials or private keys..."
          FOUND=0
          if git grep -E -I -n "BEGIN (RSA|OPENSSH|DSA|EC|PGP) PRIVATE KEY" -- . ":(exclude)vendor" ":(exclude).git" 2>/dev/null; then
            echo "::error::Private cryptographic key found in tracked repository files!"
            FOUND=1
          fi
          if git grep -E -I -n "(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z\\-_]{35})" -- . ":(exclude)vendor" ":(exclude).git" 2>/dev/null; then
            echo "::error::Potential hardcoded cloud API credential detected!"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "Secrets check passed: .env is excluded and no exposed keys detected."

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo, pdo_mysql, zip, json
          tools: composer
          coverage: none

      - name: Display PHP version
        run: php --version

      - name: Install Composer dependencies
        shell: bash
        run: |
          if [ -f composer.json ]; then
            composer validate --no-check-publish
            if [ -f composer.lock ]; then
              composer install --no-interaction --prefer-dist --no-progress
            else
              echo "::error::composer.lock is missing."
              echo "Commit composer.lock for reproducible CI builds."
              exit 1
            fi
          else
            echo "No composer.json found; skipping dependency installation."
          fi

      - name: Check PHP syntax
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.php')

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No tracked PHP files found."
            exit 1
          fi

          echo "Validating syntax across ${#files[@]} tracked PHP files..."
          for file in "${files[@]}"; do
            php -l "$file" || exit 1
          done
          echo "All tracked PHP files passed syntax check!"

      - name: Run PHP_CodeSniffer PSR-12 check
        shell: bash
        run: |
          echo "Validating PHP code style against PSR-12 standard and baseline..."
          php bin/check-phpcs-baseline.php

      - name: Run PHPStan static analysis
        shell: bash
        run: |
          echo "Running PHPStan static analysis at configured level with baseline..."
          vendor/bin/phpstan analyse --memory-limit 512M --no-progress

      - name: Run DSA automated unit tests
        shell: bash
        run: |
          if [ -f scratch/test_dsa_suite.php ]; then
            echo "Running automated Data Structures & Algorithms unit test suite..."
            php scratch/test_dsa_suite.php
          else
            echo "scratch/test_dsa_suite.php not found; skipping."
          fi

      - name: Initialize test database schema and seed data
        shell: bash
        run: |
          echo "Checking MySQL client availability..."
          if ! command -v mysql &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y default-mysql-client
          fi

          echo "Importing database schema into hris_test..."
          mysql -h 127.0.0.1 -P 3306 -u hris_test_user -ptest_password hris_test < database/schema.sql

          if [ -d database/migrations ]; then
            echo "Applying incremental database migrations..."
            for migration in database/migrations/*.sql; do
              if [ -f "$migration" ]; then
                echo "Applying $migration..."
                mysql -h 127.0.0.1 -P 3306 -u hris_test_user -ptest_password hris_test < "$migration"
              fi
            done
          fi

          if [ -f database/seed.sql ]; then
            echo "Importing seed data into hris_test..."
            mysql -h 127.0.0.1 -P 3306 -u hris_test_user -ptest_password hris_test < database/seed.sql
          fi
          echo "Database schema and seed initialized successfully."

      - name: Run PHPUnit tests
        shell: bash
        run: |
          if [ -x vendor/bin/phpunit ]; then
            if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
              vendor/bin/phpunit
            else
              echo "PHPUnit is installed, but no PHPUnit configuration exists."
              echo "Configure tests before enabling this step as a required check."
              exit 1
            fi
          else
            echo "PHPUnit is not installed; automated tests are skipped."
          fi

  terraform-validation:
    name: Terraform Formatting, Validation, and TFLint
    runs-on: ubuntu-24.04
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Verify Terraform version
        run: terraform version

      - name: Check Terraform formatting (recursive)
        run: |
          echo "Checking canonical Terraform formatting across all configurations..."
          terraform fmt -check -recursive

      - name: Create Terraform plugin cache dir
        run: mkdir -p "${{ github.workspace }}/.terraform.d/plugin-cache"

      - name: Cache Terraform Provider Plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - name: Initialize and validate Root Terraform configuration
        run: |
          echo "Validating root Terraform configuration in terraform/..."
          for i in 1 2 3 4 5; do
            if terraform -chdir=terraform init -backend=false; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "Terraform init failed after 5 attempts due to upstream registry timeout."
              exit 1
            fi
            echo "Terraform init failed (attempt $i/5). Retrying in 10s..."
            sleep 10
          done
          terraform -chdir=terraform validate

      - name: Initialize and validate Development Environment configuration
        run: |
          echo "Validating development environment configuration in terraform/environments/dev/..."
          for i in 1 2 3 4 5; do
            if terraform -chdir=terraform/environments/dev init -backend=false; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "Terraform init failed after 5 attempts due to upstream registry timeout."
              exit 1
            fi
            echo "Terraform init failed (attempt $i/5). Retrying in 10s..."
            sleep 10
          done
          terraform -chdir=terraform/environments/dev validate

      - name: Initialize and validate Production Environment configuration
        run: |
          echo "Validating production environment configuration in terraform/environments/prod/..."
          for i in 1 2 3 4 5; do
            if terraform -chdir=terraform/environments/prod init -backend=false; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "Terraform init failed after 5 attempts due to upstream registry timeout."
              exit 1
            fi
            echo "Terraform init failed (attempt $i/5). Retrying in 10s..."
            sleep 10
          done
          terraform -chdir=terraform/environments/prod validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.55.0"

      - name: Run TFLint on Terraform configurations
        run: |
          echo "Initializing TFLint plugins..."
          tflint --init
          echo "Running TFLint on root module..."
          tflint --chdir=terraform
          echo "Running TFLint on dev environment..."
          tflint --chdir=terraform/environments/dev
          echo "Running TFLint on prod environment..."
          tflint --chdir=terraform/environments/prod
          echo "TFLint checks completed successfully!"

  docker-build:
    name: Dockerfile Lint and Container Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: |
          echo "Validating Docker container build..."
          docker build -t hris-app:ci .
          echo "Docker container built successfully."

      - name: Run Trivy container vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'hris-app:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
