services:
  # -----------------------------------------------------------------------------
  # 1. Reverse Proxy Service: Nginx
  # Entry point for browser requests, routing to Apache/PHP backend
  # Available on host: http://localhost:8080
  # -----------------------------------------------------------------------------
  nginx:
    container_name: hris_nginx
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - hris_network

  # -----------------------------------------------------------------------------
  # 2. Application Service: PHP 8.2 + Apache Front Controller
  # Internal web server reachable via Nginx reverse proxy on http://app:80
  # -----------------------------------------------------------------------------
  app:
    container_name: hris_app
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      APP_NAME: "Employee HRIS & Leave Management System"
      APP_ENV: development
      BASE_URL: "http://localhost:8080"
      TIMEZONE: "Asia/Manila"
      SESSION_LIFETIME: 1800
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hris_db
      DB_USERNAME: hris_user
      DB_PASSWORD: hris_password
      DB_CHARSET: utf8mb4
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hris_network

  # -----------------------------------------------------------------------------
  # 3. Database Service: MySQL 8.0 with Persistent Volume & Auto-Initialization
  # Available on host: localhost:3307 (avoids collision with local XAMPP 3306)
  # Internal Docker network: db:3306
  # -----------------------------------------------------------------------------
  db:
    container_name: hris_db
    image: mysql:8.0
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hris_db
      MYSQL_USER: hris_user
      MYSQL_PASSWORD: hris_password
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - hris_network

  # -----------------------------------------------------------------------------
  # 4. Database Management: phpMyAdmin
  # Available on host: http://localhost:8081
  # -----------------------------------------------------------------------------
  phpmyadmin:
    container_name: hris_phpmyadmin
    image: phpmyadmin:latest
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hris_network

  # -----------------------------------------------------------------------------
  # 5. Monitoring Exporter: Nginx Prometheus Exporter
  # Scrapes internal Nginx stub_status metrics on port 8082
  # Exposes metrics on internal port 9113 for Prometheus
  # -----------------------------------------------------------------------------
  nginx-exporter:
    container_name: hris_nginx_exporter
    image: nginx/nginx-prometheus-exporter:1.1.0
    command:
      - --nginx.scrape-uri=http://nginx:8082/stub_status
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - hris_network

  # -----------------------------------------------------------------------------
  # 6. Monitoring Exporter: MySQL Prometheus Exporter
  # Scrapes MySQL operational and performance metrics via least-privilege user
  # Exposes metrics on internal port 9104 for Prometheus
  # -----------------------------------------------------------------------------
  mysqld-exporter:
    container_name: hris_mysqld_exporter
    image: prom/mysqld-exporter:v0.15.1
    command:
      - --config.my-cnf=/etc/.my.cnf
    volumes:
      - ./docker/mysql/my-exporter.cnf:/etc/.my.cnf:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hris_network

  # -----------------------------------------------------------------------------
  # 7. Metrics Aggregation: Prometheus Server
  # Time-series metrics engine scraping Nginx, MySQL, and Prometheus targets
  # Available on host: http://localhost:9090
  # -----------------------------------------------------------------------------
  prometheus:
    container_name: hris_prometheus
    image: prom/prometheus:v2.51.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - nginx-exporter
      - mysqld-exporter
    restart: unless-stopped
    networks:
      - hris_network

  # -----------------------------------------------------------------------------
  # 8. Visualization Dashboards: Grafana
  # Provisioned with Prometheus data source and HRIS monitoring dashboards
  # Available on host: http://localhost:3100 (configurable via GRAFANA_PORT)
  # -----------------------------------------------------------------------------
  grafana:
    container_name: hris_grafana
    image: grafana/grafana:10.4.1
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - hris_network

# -----------------------------------------------------------------------------
# Storage Volumes (Persistent)
# -----------------------------------------------------------------------------
volumes:
  db_data:
    name: hris_db_data
    driver: local
  prometheus_data:
    name: hris_prometheus_data
    driver: local
  grafana_data:
    name: hris_grafana_data
    driver: local

# -----------------------------------------------------------------------------
# Isolated Bridge Network
# -----------------------------------------------------------------------------
networks:
  hris_network:
    name: hris_network
    driver: bridge
