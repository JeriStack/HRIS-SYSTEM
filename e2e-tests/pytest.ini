[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: Critical sanity and smoke check tests
    auth: Authentication, credentials validation, and OTP tests
    dashboard: HR and Employee dashboard interface tests
    employee: Employee directory, creation, edit, and deactivation tests
    department: Department and position management tests
    leave: Leave filing, balance calculation, and HR approval/rejection workflows
    rbac: Role-based access control and unauthorized URL protection tests
    brave: Tests validated on Brave Browser

