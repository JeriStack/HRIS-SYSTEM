# =============================================================================
# Production Hardened Nginx Reverse Proxy Configuration (nginx.prod.conf)
# Employee HRIS & Leave Management System
# Architecture:
#   Public Internet (80/443) -> Nginx (SSL/TLS Termination, WAF, Rate Limiting)
#     -> HTTP / App: http://app:80 (Apache + PHP 8.5)
#     -> WSS / Realtime: http://realtime:8090 (/ws WebSocket)
#     -> ACME Challenge: /var/www/certbot
# =============================================================================

# Upstream PHP Application Backend
upstream hris_backend {
    server app:80;
    keepalive 32;
}

# WebSocket upgrade negotiation
map $http_upgrade $hris_connection_upgrade {
    default upgrade;
    ''      close;
}

# -----------------------------------------------------------------------------
# Rate Limiting Zones (DDoS & Brute-Force Mitigation)
# -----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=hris_general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=hris_auth_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=hris_conn_limit:10m;

# -----------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80)
# Handles ACME challenges and enforces global HTTPS redirection
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Let's Encrypt / Certbot automated challenge endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Internal healthcheck bypass (for container monitoring)
    location /healthz {
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Redirect all other HTTP traffic to HTTPS (301 Permanent)
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# 2. Production HTTPS Server Block (Port 443)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Hide Nginx version and upstream runtime headers
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Gzip compression for text assets & API responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    # TLS Certificates (Mounted via Let's Encrypt Certbot volume)
    # Default fallback path: update to your domain in production
    ssl_certificate /etc/letsencrypt/live/hris-system/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hris-system/privkey.pem;

    # Modern TLS Protocols and Cipher Suites (Mozilla Modern Guideline)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Strict Security Response Headers (OWASP Top 10 Hardening)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' wss: https:;" always;

    # Client Request & Upload Limits
    client_max_body_size 32M;
    client_body_buffer_size 128k;

    # Connection & Rate Limit Status Codes (429 Too Many Requests)
    limit_conn hris_conn_limit 20;
    limit_conn_status 429;
    limit_req_status 429;

    # Proxy Timeouts & Buffering
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;
    proxy_http_version 1.1;

    # Standard Forwarding Headers
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    # Security: Block Hidden Files & VCS metadata (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Block Sensitive File Formats & Code Backups
    location ~* \.(env|git|htaccess|sql|bak|yml|yaml|ini|sh|bat|md)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Rate Limiting on Auth, OTP, Recovery & Public Support Endpoints (Mitigate brute-force / email flooding)
    location ~* ^/(login|api/v1/auth/login|verify-otp|api/v1/auth/verify-otp|resend-otp|forgot-password|reset-password|auth/support/report) {
        limit_req zone=hris_auth_limit burst=10 nodelay;
        proxy_pass http://hris_backend;
    }

    # Real-time WebSocket Endpoint (WSS over HTTPS) -> realtime:8090
    location = /ws {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $hris_realtime_upstream http://realtime:8090;
        proxy_pass $hris_realtime_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hris_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Main Application Traffic
    location / {
        limit_req zone=hris_general_limit burst=50 nodelay;
        proxy_pass http://hris_backend;
    }

    # Error Page Handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# -----------------------------------------------------------------------------
# 3. Internal Prometheus Metrics Server Block
# Strictly listens on internal Docker network port 8082 (never published to host)
# -----------------------------------------------------------------------------
server {
    listen 8082;
    server_name localhost _;
    server_tokens off;

    access_log off;

    location /stub_status {
        stub_status;
        access_log off;
    }

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}

