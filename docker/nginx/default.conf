# =============================================================================
# Nginx Reverse Proxy Configuration for HRIS Application
# Architecture: Browser -> Nginx (8080:80) -> Apache/PHP (app:80) -> MySQL (db:3306)
# =============================================================================

upstream hris_backend {
    server app:80;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# Main Application Server Block
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name localhost _;

    # Client upload limits (matches PHP post_max_size and upload_max_filesize)
    client_max_body_size 64M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Forwarding headers
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Buffer configuration
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;

    # Main reverse proxy routing
    location / {
        proxy_pass http://hris_backend;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# -----------------------------------------------------------------------------
# Internal Metrics Server Block (Stub Status for Prometheus Exporter)
# Listens strictly on internal Docker network port 8082 (NOT published to host)
# -----------------------------------------------------------------------------
server {
    listen 8082;
    server_name localhost _;

    access_log off;

    location /stub_status {
        stub_status;
        access_log off;
    }

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
