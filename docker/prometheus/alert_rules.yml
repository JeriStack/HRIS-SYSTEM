# =============================================================================
# Prometheus Alerting Rules
# Employee HRIS & Leave Management System
# =============================================================================

groups:
  - name: hris_system_alerts
    rules:
      # -------------------------------------------------------------------------
      # 1. Service & Exporter Availability Alerts
      # -------------------------------------------------------------------------
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.instance }} ({{ $labels.job }}) is down"
          description: "Target {{ $labels.instance }} has been unreachable for more than 1 minute."

      - alert: NginxDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx reverse proxy is down"
          description: "nginx-exporter cannot scrape Nginx stub_status for more than 1 minute."

      - alert: MySQLDown
        expr: mysql_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MySQL database is down"
          description: "mysqld-exporter cannot connect to MySQL for more than 1 minute."

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus configuration reload failed"
          description: "The last Prometheus config reload via /-/reload failed; check prometheus.yml and alert_rules.yml."

      # -------------------------------------------------------------------------
      # 2. MySQL Database Health Alerts
      # -------------------------------------------------------------------------
      - alert: MySQLTooManyConnections
        expr: (mysql_global_status_threads_connected / mysql_global_variables_max_connections) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MySQL connection pool reaching capacity"
          description: "MySQL active connections are above 80% of configured maximum."

      - alert: MySQLSlowQueriesDetected
        expr: rate(mysql_global_status_slow_queries[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated rate of slow queries in MySQL"
          description: "MySQL is executing slow queries at a rate of > 0.5/s over the last 5 minutes."

      # -------------------------------------------------------------------------
      # 3. Nginx Web Server Alerts
      # -------------------------------------------------------------------------
      - alert: NginxHighActiveConnections
        expr: nginx_connections_active > 200
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated active connections on Nginx"
          description: "Nginx active connections have remained above 200 for more than 2 minutes."

      # -------------------------------------------------------------------------
      # 4. HRIS Application & Queue Health Alerts (/metrics)
      # -------------------------------------------------------------------------
      - alert: HRISAppDatabaseDisconnected
        expr: hris_app_database_connected == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HRIS PHP application lost database connectivity"
          description: "The /metrics endpoint reports hris_app_database_connected == 0 for more than 1 minute."

      - alert: HRISHighDatabaseLatency
        expr: hris_app_database_latency_seconds > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HRIS database ping latency"
          description: "HRIS application database ping latency has exceeded 1 second for 2 minutes."

      - alert: HRISFailedQueueJobsDetected
        expr: hris_queue_jobs_failed_total > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Failed background queue jobs detected"
          description: "There are {{ $value }} failed dead-letter job(s) in failed_jobs for more than 5 minutes."
