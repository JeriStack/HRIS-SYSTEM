# =============================================================================
# Prometheus Alerting Rules
# Employee HRIS & Leave Management System
# =============================================================================

groups:
  - name: hris_system_alerts
    rules:
      # -------------------------------------------------------------------------
      # 1. Service Availability Alert
      # -------------------------------------------------------------------------
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} ({{ $labels.job }}) is down"
          description: "Target {{ $labels.instance }} has been unreachable for more than 1 minute."

      # -------------------------------------------------------------------------
      # 2. MySQL Database Health Alerts
      # -------------------------------------------------------------------------
      - alert: MySQLTooManyConnections
        expr: (mysql_global_status_threads_connected / mysql_global_variables_max_connections) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MySQL connection pool reaching capacity"
          description: "MySQL active connections are above 80% of configured maximum."

      - alert: MySQLSlowQueriesDetected
        expr: rate(mysql_global_status_slow_queries[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated rate of slow queries in MySQL"
          description: "MySQL is executing slow queries at a rate of > 0.5/s over the last 5 minutes."

      # -------------------------------------------------------------------------
      # 3. Nginx Web Server Alerts
      # -------------------------------------------------------------------------
      - alert: NginxHigh5xxErrorRate
        expr: rate(nginx_connections_accepted[5m]) > 0 and (rate(nginx_connections_active[5m]) > 200)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated active connections or possible traffic spike on Nginx"
          description: "Active connections on front reverse proxy exceeded threshold."

