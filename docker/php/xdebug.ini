; Xdebug settings for local development images only (INSTALL_XDEBUG=true).
; Debugging is off unless the XDEBUG_MODE environment variable enables it,
; and even then a session starts only when a request carries XDEBUG_TRIGGER
; (query string, cookie, or the "Xdebug helper" browser extension).
xdebug.mode=off
xdebug.start_with_request=trigger
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
; Silence "could not connect to debugging client" warnings when no IDE is listening
xdebug.log_level=0
